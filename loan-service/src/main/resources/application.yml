server:
  port: 8084
spring:
  application:
    name: loan-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loan_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Anirudha008@}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info
